[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "montecarlgym"
version = "0.2.0a2"
description = "Gymnasium-compatible MCTS and adaptive multi-fidelity planning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MonteCarloGym Contributors"}]
keywords = [
  "mcts",
  "gymnasium",
  "planning",
  "agents",
  "model-routing",
  "test-time-compute",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
gym = ["gymnasium>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
release = ["build>=1.2", "twine>=5.1"]
research = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13"]

[project.scripts]
mcg-experiment = "montecarlgym.experiments.runner:main"

[project.urls]
Documentation = "https://github.com/nmasamba/Monte-Carlo-Gym/tree/main/docs"
Repository = "https://github.com/nmasamba/Monte-Carlo-Gym"
Issues = "https://github.com/nmasamba/Monte-Carlo-Gym/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["gymnasium", "gymnasium.*", "numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
